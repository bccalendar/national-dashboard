<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regional Events Overview</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg-page:#f9f9f9; --bg-card:#ffffff; --bg-header:#ffffff;
    --primary:#990000; --text-main:#333333; --text-muted:#666666;
    --border:#e5e5e5; --info:#009CA6; --radius:6px;
    --ok:#009E49; --warn:#F59E0B; --danger:#DC3545; --muted:#6b7280; --collab:#2563eb;
    --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#121212; --bg-card:#1e1e1e; --bg-header:#1e1e1e;
      --text-main:#e0e0e0; --text-muted:#a0a0a0; --border:#333333;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg-page);color:var(--text-main);line-height:1.45}
  .top-bar{position:sticky;top:0;z-index:100;display:flex;align-items:center;flex-wrap:wrap;gap:14px 18px;background:var(--bg-header);border-bottom:4px solid var(--primary);padding:12px 24px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .top-bar img{width:140px;max-width:38vw;height:auto;flex:none}
  .top-titles{min-width:0;flex:1}
  h1{font-size:20px;margin:0;color:var(--text-main)}
  .sub{color:var(--text-muted);font-size:12px;margin:2px 0 0}
  .region-pick{display:flex;flex-direction:column;gap:3px;min-width:230px}
  .region-pick label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--primary)}
  select,input[type=text]{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-main);font-size:14px;font-family:inherit}
  .wrap{max-width:1000px;margin:18px auto;padding:0 16px 60px}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
  .toolbar .search{flex:1;min-width:200px}
  .filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:16px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .fld{display:flex;flex-direction:column;gap:3px;min-width:140px;flex:1;position:relative}
  .fld > label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted)}
  /* multi-select (location) */
  .ms-box{width:100%;padding:9px 28px 9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-main);font-size:14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
  .ms-box::after{content:'▾';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:11px}
  .ms-box.ph{color:var(--text-muted)}
  .ms-panel{position:absolute;top:100%;left:0;right:0;z-index:60;margin-top:4px;max-height:240px;overflow:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:4px}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text-main)}
  .ms-opt:hover{background:rgba(153,0,0,.08)}
  .ms-opt input{width:15px;height:15px;accent-color:var(--primary);flex:none}
  .ms-search{position:sticky;top:0;background:var(--bg-card);padding:2px 2px 6px}
  .ms-search input{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-main);font-size:13px;font-family:inherit}
  .ms-empty{padding:7px 9px;font-size:12.5px;color:var(--text-muted)}
  input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-main);font-size:13px;font-family:inherit}
  .btn-clear{align-self:flex-end;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-clear:hover{border-color:var(--primary);color:var(--primary)}
  .btn-csv{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-csv:hover{filter:brightness(1.08)}
  .btn-csv:disabled{opacity:.5;cursor:not-allowed}
  .btn-pdf{background:var(--info);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-pdf:hover{filter:brightness(1.08)}
  .btn-pdf:disabled{opacity:.5;cursor:not-allowed}
  .cat-tag{font-size:10px;font-weight:700;color:#fff;background:var(--muted);border-radius:4px;padding:2px 6px;text-transform:uppercase;margin-left:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--border);background:var(--bg-card);color:var(--text-main);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .count{font-size:13px;color:var(--text-muted);margin-left:auto}
  .note{background:#fff8e1;border:1px solid #f0d78a;color:#7a5c00;border-radius:var(--radius);padding:9px 13px;font-size:12.5px;margin-bottom:12px}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .note{background:#332b12;border-color:#5c4a1c;color:#e3c766}}
  .recur-tag{font-size:10px;font-weight:700;color:#fff;background:var(--info);border-radius:4px;padding:2px 6px;text-transform:uppercase;margin-left:4px}
  .month{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .ev{display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--border);border-left:4px solid var(--muted);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s}
  .ev:hover{box-shadow:0 4px 12px rgba(0,0,0,.10);transform:translateY(-1px)}
  .ev-date{flex:none;width:58px;text-align:center;border-right:1px solid var(--border);padding-right:12px}
  .ev-date .d{font-size:22px;font-weight:800;line-height:1;color:var(--text-main)}
  .ev-date .m{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--primary)}
  .ev-date .yr{font-size:10px;color:var(--text-muted)}
  .ev-main{flex:1;min-width:0}
  .ev-title{font-size:15px;font-weight:700;color:var(--text-main);margin:0 0 3px;word-break:break-word}
  .ev-meta{font-size:12.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:4px 12px}
  .ev-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;text-transform:uppercase}
  .b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-danger{background:var(--danger)} .b-muted{background:var(--muted)} .b-info{background:var(--info)}
  .ev.s-ok{border-left-color:var(--ok)} .ev.s-warn{border-left-color:var(--warn)} .ev.s-danger{border-left-color:var(--danger)} .ev.s-info{border-left-color:var(--info)}
  .view{background:var(--info);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;text-decoration:none;display:inline-block}
  .view:hover{filter:brightness(1.06)}
  .edit-tag{font-size:10px;font-weight:700;color:#fff;background:var(--collab);border-radius:4px;padding:2px 6px;text-transform:uppercase}
  .state{padding:40px 20px;text-align:center;color:var(--text-muted)}
  .spinner{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* view toggle */
  .vtoggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .vtoggle button{background:var(--bg-card);color:var(--text-muted);border:none;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .vtoggle button.on{background:var(--primary);color:#fff}
  /* calendar */
  .cal-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 12px}
  .cal-nav button{background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);border-radius:8px;width:34px;height:34px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .cal-nav button:hover{border-color:var(--primary);color:var(--primary)}
  .cal-nav .cal-title{font-size:16px;font-weight:800;min-width:150px;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);text-align:center;padding:4px 0}
  .cal-cell{min-height:96px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:5px 6px;overflow:hidden}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
  .cal-dnum{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:3px}
  .cal-cell.today .cal-dnum{color:var(--primary)}
  .cal-ev{display:block;font-size:11px;font-weight:600;color:#fff;border-radius:4px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;cursor:pointer}
  .cal-ev.s-ok{background:var(--ok)} .cal-ev.s-warn{background:var(--warn)} .cal-ev.s-danger{background:var(--danger)} .cal-ev.s-muted{background:var(--muted)} .cal-ev.s-info{background:var(--info)}
  .cal-more{font-size:10.5px;font-weight:700;color:var(--text-muted)}
  @media(max-width:560px){
    .ev{flex-wrap:wrap}
    .ev-right{flex-direction:row;width:100%;justify-content:space-between;align-items:center}
    .top-bar img{width:110px}
    .region-pick{width:100%;min-width:0}
    .cal-grid{gap:3px}
    .cal-cell{min-height:60px;padding:3px}
    .cal-dow{font-size:9px}
    .cal-ev{font-size:9px;padding:1px 3px}
    .cal-ev .ce-t{display:none}
  }
</style>
</head>
<body>
<header class="top-bar">
  <picture>
    <source srcset="light-logo.png" media="(prefers-color-scheme: dark)">
    <img src="dark-logo.png" alt="the Ismaili Canada" onerror="this.style.display='none'">
  </picture>
  <div class="top-titles">
    <h1>Regional Events Overview</h1>
    <div class="sub">Upcoming events and their approval status</div>
  </div>
  <div class="region-pick">
    <label for="regionSel">Region</label>
    <select id="regionSel"></select>
  </div>
  <div class="region-pick" style="min-width:0">
    <label>Data source</label>
    <div class="vtoggle" id="srcToggle">
      <button data-s="log" class="on" title="Approved event requests from the event log">🗂 Event Log</button>
      <button data-s="cal" title="Entries from the region's Outlook calendar">📆 Calendar</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar" id="toolbar" hidden>
    <div class="search"><input type="text" id="search" placeholder="Search by title, board or location…"></div>
    <div class="chips" id="statusChips"></div>
    <div class="vtoggle" id="vtoggle">
      <button data-v="list" class="on">☰ List</button>
      <button data-v="cal">▦ Calendar</button>
    </div>
    <button class="btn-csv" id="csvBtn" title="Download the rows shown below as a spreadsheet (CSV)">⬇ CSV</button>
    <button class="btn-pdf" id="pdfBtn" title="Download the rows shown below as a PDF">⬇ PDF</button>
    <div class="count" id="count"></div>
  </div>
  <div class="filters" id="filters" hidden>
    <div class="fld"><label for="rangeSel">Time range</label><select id="rangeSel">
      <option value="3m">Next 3 months</option>
      <option value="6m">Next 6 months</option>
      <option value="12m">Next 12 months</option>
      <option value="p3m">Past 3 months</option>
      <option value="p6m">Past 6 months</option>
      <option value="p12m">Past 12 months</option>
      <option value="custom">Custom range…</option>
    </select></div>
    <div class="fld"><label for="fromDate">From date</label><input type="date" id="fromDate"></div>
    <div class="fld"><label for="toDate">To date</label><input type="date" id="toDate"></div>
    <div class="fld"><label for="boardSel">Board</label><select id="boardSel"><option value="">All boards</option></select></div>
    <div class="fld" id="svcFld">
      <label>Services needed</label>
      <div class="ms-box ph" id="svcBox" tabindex="0" role="button" aria-haspopup="true">All services</div>
      <div class="ms-panel" id="svcPanel" hidden></div>
    </div>
    <div class="fld" id="locFld">
      <label>Location</label>
      <div class="ms-box ph" id="locBox" tabindex="0" role="button" aria-haspopup="true">All locations</div>
      <div class="ms-panel" id="locPanel" hidden></div>
    </div>
    <button class="btn-clear" id="clearBtn" type="button">Clear filters</button>
  </div>
  <div class="note" id="note" hidden></div>
  <div id="content"><div class="state">Select a region to view its upcoming events.</div></div>
</div>

<script>
/* ============================ CONFIG ============================ */
// Paste the GET URL of the "NationalRegionEvents" flow here after importing the solution:
const REGION_EVENTS_URL = "https://default98d027077ed646d2acf222ebdd2d5c.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/19/workflows/4c79c444dc5c4cba973042e78e2402a8/triggers/manual/paths/invoke?api-version=1&sp=/triggers/manual/run&sv=1.0&sig=UdQ9vAkBUiR4e0pf8ngfI9PeRNZjzmnJFTBpUE6xiKg";
// GET URL of the "NationalRegionCalendar" flow:
const REGION_CALENDAR_URL = "https://default98d027077ed646d2acf222ebdd2d5c.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/9f8fb70202f7455192157b87d0efeb75/triggers/manual/paths/invoke?api-version=1&sp=/triggers/manual/run&sv=1.0&sig=mR0flGJ-rgZmzIVhxUcM1S6eVP1HEiXNR2WqDruC1yE";
// Per-event dashboard page (same repo):
const EVENT_PAGE = "index.html";
const PH = "—";  // placeholder when a field can't be found (common for manual/recurring calendar entries)
const REGIONS = ["All Canada","British Columbia","Edmonton","Toronto","Southwest Ontario","Northeast Ontario","All Ontario","Prairies","Quebec and Maritimes"];
// Windows timezone names (as stored in config) -> IANA (what Intl needs)
const WIN_TZ = {
  "pacific standard time":"America/Vancouver",
  "mountain standard time":"America/Edmonton",
  "central standard time":"America/Winnipeg",
  "eastern standard time":"America/Toronto",
  "atlantic standard time":"America/Halifax",
  "newfoundland standard time":"America/St_Johns",
  "utc":"UTC","gmt standard time":"Europe/London"
};
function toIana(v){ if(!v) return ''; const s=String(v).trim(); if(s.indexOf('/')>-1) return s; return WIN_TZ[s.toLowerCase()]||''; }
// timezone fallback per region (used when config Timezone is blank)
const DEFAULT_TZ = {
  "British Columbia":"America/Vancouver",
  "Edmonton":"America/Edmonton", "Prairies":"America/Edmonton",
  "Toronto":"America/Toronto", "Southwest Ontario":"America/Toronto",
  "Northeast Ontario":"America/Toronto", "All Ontario":"America/Toronto",
  "Quebec and Maritimes":"America/Toronto", "All Canada":"America/Toronto"
};
const FETCH_LIMIT = 500;    // page size hint sent to the flow (it auto-pages beyond this)
const PAGE_CEILING = 5000;  // flow's safety cap; only past this do we ask to narrow the window
const RANGES = {
  '3m':  {months:3,  dir:'future'},
  '6m':  {months:6,  dir:'future'},
  '12m': {months:12, dir:'future'},
  'p3m': {months:3,  dir:'past'},
  'p6m': {months:6,  dir:'past'},
  'p12m':{months:12, dir:'past'}
};

/* ============================ ENGINE ============================ */
const q = new URLSearchParams(location.search);
let ALL = [];               // all events for the region
let activeStatus = "All";
let currentView = "list";   // "list" | "cal"
let calYM = null;           // {y, m} month shown in calendar view
let truncated = false;      // true if fetch hit FETCH_LIMIT
let source = (function(){ try{return localStorage.getItem('ov_source')||'log'}catch(e){return 'log'} })(); // 'log' | 'cal'
const sel = document.getElementById('regionSel');
const content = document.getElementById('content');

// build region dropdown
sel.innerHTML = '<option value="">— Select region —</option>' + REGIONS.map(r=>`<option value="${r}">${r}</option>`).join('');
const startRegion = q.get('r') || (function(){ try{return localStorage.getItem('ov_region')||''}catch(e){return ''} })();
if(startRegion && REGIONS.indexOf(startRegion)!==-1) sel.value = startRegion;
sel.addEventListener('change', ()=>{ const r=sel.value; try{localStorage.setItem('ov_region',r)}catch(e){}
  const u=new URLSearchParams(location.search); if(r)u.set('r',r); else u.delete('r'); history.replaceState(null,'','?'+u.toString());
  if(r) load(r); else { content.innerHTML='<div class="state">Select a region to view its upcoming events.</div>'; document.getElementById('toolbar').hidden=true; document.getElementById('filters').hidden=true; document.getElementById('note').hidden=true; }
});

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dec(v){ if(v==null) return ''; try{ return decodeURIComponent(String(v)).replace(/\+/g,' '); }catch(e){ return String(v); } }
function parseMulti(data){
  if(data==null||data===''||data==='[]') return [];
  try{ var p=typeof data==='string'?JSON.parse(data):data;
    if(Array.isArray(p)) return p.map(it=> it&&it.Value!=null?it.Value:it).map(x=>dec(String(x)).replace(/^[-–—]\s*/,'')).filter(Boolean);
  }catch(e){}
  return dec(String(data)).split(/\s+[-–—]\s+/).map(x=>x.trim()).filter(Boolean);
}
function statusClass(st){
  const s=(st||'').toLowerCase();
  if(s.indexOf('reject')>-1||s.indexOf('declin')>-1||s.indexOf('cancel')>-1) return 'danger';
  if(s.indexOf('pend')>-1||s.indexOf('await')>-1||s.indexOf('review')>-1||s.indexOf('submit')>-1) return 'warn';
  if(s.indexOf('schedul')>-1||s.indexOf('approv')>-1||s.indexOf('complet')>-1||s.indexOf('confirm')>-1) return 'ok';
  return 'muted';
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseDate(d){ if(!d) return null; const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function yn(v){ const s=String(v==null?'':v).toLowerCase(); if(s==='yes'||s==='true'||s==='1') return 'Yes'; if(s==='no'||s==='false'||s==='0') return 'No'; return v||''; }
// compute the {from,to} fetch window from the Time-range control
function computeRange(){
  const preset=document.getElementById('rangeSel').value;
  if(preset==='custom'){ return {from:document.getElementById('fromDate').value||'', to:document.getElementById('toDate').value||''}; }
  const r=RANGES[preset]||RANGES['3m']; const today=new Date(); today.setHours(0,0,0,0); const other=new Date(today);
  if(r.dir==='future'){ other.setMonth(other.getMonth()+r.months); return {from:fmt(today), to:fmt(other)}; }
  other.setMonth(other.getMonth()-r.months); return {from:fmt(other), to:fmt(today)};
}

/* ---- calendar-mode helpers ---- */
// convert a Graph UTC dateTime string to the region's local date/time
function toLocal(dt, tz){
  if(!dt) return {dateISO:'', timeStr:''};
  const iso = /[zZ]|[+\-]\d\d:?\d\d$/.test(dt) ? dt : dt+'Z';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return {dateISO:'', timeStr:''};
  try{
    const dateISO = new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
    const timeStr = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
    return {dateISO, timeStr, dateObj:d};
  }catch(e){
    return {dateISO:d.toISOString().slice(0,10), timeStr:d.toISOString().slice(11,16)};
  }
}
function durationMin(start,end){
  if(!start||!end) return '';
  const a=new Date(/[zZ]$/.test(start)?start:start+'Z'), b=new Date(/[zZ]$/.test(end)?end:end+'Z');
  if(isNaN(a)||isNaN(b)) return '';
  const m=Math.round((b-a)/60000); return m>=0? m : '';
}
// replicate the Power BI body-parse: value in the first <td> after a label
function extractBodyField(html,label){
  if(!html) return '';
  const parts0=String(html).split(label); if(parts0.length<2) return '';
  const after=parts0.slice(1).join(label);
  const start=after.indexOf('<td'); if(start<0) return '';
  const gt=after.indexOf('>',start); if(gt<0) return '';
  const end=after.indexOf('</td>',gt); if(end<0) return '';
  const inner=after.substring(gt+1,end);
  const bits=inner.split(/[<>]/).map(x=>x.replace(/&nbsp;/g,' ').trim())
    .filter(x=> x && x.indexOf('=')===-1 && !x.startsWith('/'));
  return bits.join(' ').replace(/\s+/g,' ').trim();
}

async function load(region){
  const range=computeRange();
  document.getElementById('fromDate').value=range.from;
  document.getElementById('toDate').value=range.to;
  content.innerHTML='<div class="state"><div class="spinner"></div><div style="margin-top:10px;">Loading '+(source==='cal'?'calendar':'events')+' for '+esc(region)+'…</div></div>';
  return source==='cal' ? loadCalendar(region,range) : loadLog(region,range);
}

async function loadLog(region,range){
  if(REGION_EVENTS_URL.indexOf('http')!==0){ content.innerHTML='<div class="state"><b>Setup needed</b><br>Set <code>REGION_EVENTS_URL</code> in overview.html to the GET URL of the NationalRegionEvents flow.</div>'; return; }
  try{
    const sep=REGION_EVENTS_URL.indexOf('?')>-1?'&':'?';
    let url=REGION_EVENTS_URL+sep+'region='+encodeURIComponent(region)+'&top='+FETCH_LIMIT;
    if(range.from) url+='&from='+encodeURIComponent(range.from);
    if(range.to)   url+='&to='+encodeURIComponent(range.to);
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    ALL=(data.events||[]).map(e=>{
      const locs=parseMulti(e.location);
      const req=v=>{ const s=String(v==null?'':v).toLowerCase(); return s && s!=='not requested'; };
      const services=[];
      if(req(e.commsStatus)) services.push('Communications');
      if(req(e.avStatus)) services.push('Audio Visual');
      if(req(e.ivcStatus)) services.push('Ismaili Volunteers');
      return Object.assign({}, e, {
        title:dec(e.title), location:locs.join(', '), locList:locs, services:services,
        board:dec(e.board), status:e.status||'—', _cal:false
      });
    });
    truncated = ALL.length >= (data.ceiling || PAGE_CEILING);
    activeStatus="All"; calYM=null;
    populateFilters(); renderChips(); render();
  }catch(err){ content.innerHTML='<div class="state">Could not load events: '+esc(err.message)+'<br><span style="font-size:12px">Check the region link and that the NationalRegionEvents flow is on.</span></div>'; document.getElementById('note').hidden=true; }
}

async function loadCalendar(region,range){
  if(REGION_CALENDAR_URL.indexOf('http')!==0){ content.innerHTML='<div class="state"><b>Calendar source not set up yet</b><br>Import v3.9.16, then paste the <code>NationalRegionCalendar</code> flow URL into <code>REGION_CALENDAR_URL</code> in overview.html, and set each region\'s <code>CalendarId</code> / <code>CalendarTimeZone</code> in the National Config list.</div>'; document.getElementById('toolbar').hidden=false; document.getElementById('filters').hidden=false; applySourceUI(); return; }
  try{
    const sep=REGION_CALENDAR_URL.indexOf('?')>-1?'&':'?';

    if(range.from) url+='&from='+encodeURIComponent(range.from);
    if(range.to)   url+='&to='+encodeURIComponent(range.to);
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    const tz=toIana(data.timezone) || DEFAULT_TZ[region] || 'UTC';
    if(data.error){ content.innerHTML='<div class="state">'+esc(data.error)+'</div>'; document.getElementById('toolbar').hidden=false; document.getElementById('filters').hidden=false; applySourceUI(); return; }
    ALL=(data.events||[]).map((e,i)=>{
      const loc = extractBodyField(e.body,'Event Location') || (e.location||'');
      const room = extractBodyField(e.body,'Room Booking');
      const s=toLocal(e.start,tz), en=toLocal(e.end,tz);
      const cats = Array.isArray(e.categories)? e.categories.join(', ') : (e.categories||'');
      return {
        id:'', _cal:true, title:e.subject||'(no subject)',
        date:s.dateISO, startTime:s.timeStr, endTime:en.timeStr,
        location:loc, locList: loc?[loc]:[], room:room, category:cats,
        duration:durationMin(e.start,e.end),
        board:'', status:'', submissionType:'', virtually:'', recurring:''
      };
    });

    populateFilters(); renderChips(); render();
  }catch(err){ content.innerHTML='<div class="state">Could not load calendar: '+esc(err.message)+'<br><span style="font-size:12px">Check the calendar link, the region\'s CalendarId in config, and that the NationalRegionCalendar flow is on.</span></div>'; document.getElementById('note').hidden=true; }

function isAllJK(l){ return /all.*jamatkhanas/i.test(String(l||'')); }

// current filtered list — shared by render() and CSV export
function filteredList(){
  // NOTE: date window is applied server-side (via the flow's from/to params);
  // the controls below filter within the fetched window.
  const term=(document.getElementById('search').value||'').toLowerCase();
  const board=document.getElementById('boardSel').value;
  // when a specific jamatkhana (not Other/External) is chosen, "All Jamatkhanas" events apply too
  const realJKselected=[...selectedLocs].some(l=> !isAllJK(l) && !/^other$/i.test(l) && !/external/i.test(l));
  return ALL.filter(e=>{
    if(activeStatus!=='All' && statusClass(e.status)!==activeStatus) return false;
    if(term){ const hay=(e.title+' '+e.board+' '+e.location).toLowerCase(); if(hay.indexOf(term)===-1) return false; }
    if(board && e.board!==board) return false;
    if(selectedSvcs.size){ const hasS=(e.services||[]).some(s=>selectedSvcs.has(s)); if(!hasS) return false; }
    if(selectedLocs.size){
      const has=(e.locList||[]).some(l=> selectedLocs.has(l) || (realJKselected && isAllJK(l)));
      if(!has) return false;
    }
    return true;
  });
}

/* ============================ CALENDAR VIEW ============================ */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function renderCalendar(list){
  // choose which month to show
  if(!calYM){
    const dated=list.map(e=>parseDate(e.date)).filter(Boolean).sort((a,b)=>a-b);
    const base = dated.length ? dated[0] : new Date();
    calYM={y:base.getFullYear(), m:base.getMonth()};
  }
  const y=calYM.y, m=calYM.m;
  // bucket events of this month by day
  const byDay={};
  list.forEach(e=>{ const dt=parseDate(e.date); if(dt && dt.getFullYear()===y && dt.getMonth()===m){ (byDay[dt.getDate()]=byDay[dt.getDate()]||[]).push(e); } });
  const inMonth=Object.values(byDay).reduce((n,a)=>n+a.length,0);
  const today=new Date(); const isThisMonth = today.getFullYear()===y && today.getMonth()===m;
  const first=new Date(y,m,1).getDay();       // 0=Sun
  const days=new Date(y,m+1,0).getDate();     // days in month
  let cells='';
  DOW.forEach(d=> cells+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<first;i++) cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const evs=(byDay[d]||[]);
    const isToday = isThisMonth && today.getDate()===d;
    let inner=`<div class="cal-dnum">${d}</div>`;
    evs.slice(0,3).forEach(e=>{
      const sc=statusClass(e.status);
      if(e._cal){
        const tip=e.title+' — '+(e.startTime||PH)+(e.location?(' · '+e.location):'');
        inner+=`<span class="cal-ev s-muted" title="${esc(tip)}"><span class="ce-t">${esc(e.title)}</span></span>`;
      } else {
        const isRecur = yn(e.recurring)==='Yes';
        const href=EVENT_PAGE+'?eventid='+encodeURIComponent(e.id)+'&r='+encodeURIComponent(sel.value);
        const tip='#'+e.id+' · '+e.title+(isRecur?' (recurring)':'')+' — '+e.status;
        inner+=`<a class="cal-ev s-${sc}" href="${href}" title="${esc(tip)}"><span class="ce-t">${isRecur?'🔁 ':''}${esc(e.title)}</span></a>`;
      }
    });
    if(evs.length>3) inner+=`<div class="cal-more">+${evs.length-3} more</div>`;
    cells+=`<div class="cal-cell${isToday?' today':''}">${inner}</div>`;
  }
  content.innerHTML=
    `<div class="cal-nav">
       <button id="calPrev" title="Previous month">‹</button>
       <div class="cal-title">${MON[m]} ${y}</div>
       <button id="calNext" title="Next month">›</button>
     </div>
     ${inMonth?'':'<div class="state" style="padding:14px">No matching events in this month — use ‹ › to browse other months.</div>'}
     <div class="cal-grid">${cells}</div>`;
  document.getElementById('calPrev').addEventListener('click',()=>{ calYM = m===0?{y:y-1,m:11}:{y,m:m-1}; renderCalendar(filteredList()); });
  document.getElementById('calNext').addEventListener('click',()=>{ calYM = m===11?{y:y+1,m:0}:{y,m:m+1}; renderCalendar(filteredList()); });
}

  const s=String(v==null?'':v);

function activeCSVCols(){ return source==='cal' ? CAL_COLS : CSV_COLS; }

function exportName(ext){ return (sel.value||'events').replace(/[^\w]+/g,'_')+'_'+(source==='cal'?'calendar':'events')+'_'+new Date().toISOString().slice(0,10)+'.'+ext; }

function downloadCSV(){
  const list=filteredList();
  if(!list.length) return;
  const COLS=activeCSVCols();
  const cols=COLS.map(c=>c[0]);
  const rows=list.map(e=> COLS.map(c=>csvCell(c[1](e))).join(','));
  const csv='﻿'+cols.map(csvCell).join(',')+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=exportName('csv');
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}
function downloadPDF(){
  const list=filteredList(); if(!list.length) return;
  if(!(window.jspdf && window.jspdf.jsPDF)){ alert('PDF library is still loading or was blocked — please retry in a moment.'); return; }
  const {jsPDF}=window.jspdf;
  const COLS=activePDFCols();
  const doc=new jsPDF({orientation: COLS.length>6?'l':'p', unit:'pt', format:'a4'});
  const head=[COLS.map(c=>c[0])];
  const body=list.map(e=> COLS.map(c=>{ const v=c[1](e); return (v===''||v==null)?PH:String(v); }));
  const title=(sel.value||'')+' — '+(source==='cal'?'Calendar':'Event Log');
  const sub=(document.getElementById('fromDate').value||'')+'  to  '+(document.getElementById('toDate').value||'')+'    ('+list.length+' rows)';
  doc.setFontSize(14); doc.text(title, 40, 40);
  doc.setFontSize(10); doc.setTextColor(120); doc.text(sub, 40, 58);
  doc.autoTable({ head, body, startY:72, styles:{fontSize:8,cellPadding:3,overflow:'linebreak'}, headStyles:{fillColor:[153,0,0]}, margin:{left:40,right:40} });
  doc.save(exportName('pdf'));
}

document.getElementById('pdfBtn').addEventListener('click', downloadPDF);
// data-source toggle -> re-fetch from the matching flow
document.querySelectorAll('#srcToggle button').forEach(b=> b.addEventListener('click',()=>{
  const s=b.getAttribute('data-s'); if(s===source) return;
  source=s; try{localStorage.setItem('ov_source',s)}catch(e){}
  document.querySelectorAll('#srcToggle button').forEach(x=>x.classList.toggle('on', x===b));
  activeStatus='All'; calYM=null;
  if(sel.value) load(sel.value);
}));
document.getElementById('clearBtn').addEventListener('click', ()=>{
  document.getElementById('search').value='';
  document.getElementById('boardSel').value='';
  document.getElementById('rangeSel').value='3m';
  selectedLocs.clear(); selectedSvcs.clear();
  document.querySelectorAll('#locPanel input[type=checkbox], #svcPanel input[type=checkbox]').forEach(cb=>cb.checked=false);
  const ls=document.getElementById('locSearch'); if(ls){ ls.value=''; document.querySelectorAll('#locOpts .ms-opt').forEach(o=>o.style.display=''); }
  updateLocBox(); updateSvcBox();
  activeStatus='All'; calYM=null;
  if(sel.value) load(sel.value); else { renderChips(); render(); }
});

// auto-load if region preset
if(sel.value) load(sel.value);
</script>
</body>
</html>
